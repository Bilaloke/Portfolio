<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax calculator</title>
    <link href="Css/taxcalc.css" rel="stylesheet" />
    <style>
      html {
        background-image: url(Image/background.png);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <section class="header">
          <div class="logo">
            <a href=""><img src="Image/taxwise.png" /></a>
          </div>
          <div class="writings">
            <a href="index.html">Portfolio</a>
            <a href="Jobsearch.html">Home</a>
            <a href="jobsearcher.html">Job searcher </a>
          </div>
        </section>
    <div class="leftside">
      <h2>Fill in your details</h2>
      <form class="details-form">
        <label for="job">Occupation</label>
        <input
          type="text"
          id="job"
          class="job"
          placeholder="Enter your occupation"
          required
        />

        <label for="hours">Hours per week</label>
        <input
          type="number"
          id="hours"
          class="hours"
          placeholder="Enter hours per week"
          min="20"
          max="60"
        />

        <div class="pay">
            <div class="paycont">
        <label for="income">Income</label>
        <input
          type="number"
          class="income"
          id="income"
          placeholder="Enter your income"
          required
        />
    </div>
        <div class="paycont">
        <select id="pay" name="Pay">
          <option value="hourly">Hourly</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
       </div>
    </div>

        <label for="tax">Tax rate</label>
        <input type="number" id="tax" required  step="0.10" placeholder="Enter your tax rate" />

        <label for="insurance">Insurance rate</label>
        <input
          type="number"
          id="insurance"
          step="0.10"
          placeholder="Enter your insurance rate"
          required
        />
        <div id="alert">
        </div>
        <button  type="button" onclick="taxCalculator();">Calculate now</button>
      </form>
    </div>

    <div class="rightside">
    </div>
    <script src="Js/taxcalc.js"></script>
  </body>
</html>
